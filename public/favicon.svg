<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#292524"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.3"/>
  
  <!-- PH Letters -->
  <text x="256" y="320" font-family="Georgia, serif" font-size="240" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="-10">PH</text>
  
  <!-- Small decorative line -->
  <line x1="180" y1="360" x2="332" y2="360" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
</svg>
